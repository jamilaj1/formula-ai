<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in — Formula AI Global</title>
  <meta name="description" content="Sign in to your Formula AI Global account" />
  <meta name="theme-color" content="#00ff88" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="./index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg></span>
        Formula <span>AI</span>
      </a>
      <ul class="nav-links">
        <li><a href="./index.html" data-i18n-ar="الرئيسية">Home</a></li>
        <li><a href="./search.html" data-i18n-ar="البحث الذكي">Smart Search</a></li>
        <li><a href="./pricing.html" data-i18n-ar="الأسعار">Pricing</a></li>
        <li><a href="./about.html" data-i18n-ar="من نحن">About</a></li>
      </ul>
      <div class="nav-tools">
        <button class="icon-btn theme-toggle" aria-label="Toggle theme" title="Toggle theme" data-i18n-attr="title" data-i18n-title-ar="تبديل الوضع">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <div class="lang-dropdown">
          <button class="icon-btn lang-trigger" aria-label="Language">
            <span class="flag">🇸🇦</span>
            <span class="label">AR</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="lang-menu"></div>
        </div>
      </div>

      <div class="nav-cta">
        <a href="./register.html" class="btn btn-primary" data-i18n-ar="حساب جديد">Sign up</a>
      </div>
      <button class="nav-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="hero-bg">
      <div class="hero-orb green" style="opacity: 0.4;"></div>
      <div class="hero-orb blue" style="opacity: 0.4;"></div>
    </div>

    <div class="auth-card reveal">
      <div style="text-align: center; margin-bottom: 22px;">
        <div style="width: 72px; height: 72px; background: var(--grad-primary); border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: var(--shadow-glow);">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--bg-1)" stroke-width="2.5" width="36" height="36"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>
        </div>
      </div>
      <h1 data-i18n-ar="أهلاً بعودتك">Welcome back</h1>
      <p class="auth-sub" data-i18n-ar="سجّل دخولك للوصول إلى لوحة تحكمك وفورمولاتك">Sign in to access your dashboard and formulas</p>

      <form onsubmit="event.preventDefault(); window.location.href='./dashboard.html';">
        <div class="form-group">
          <label class="form-label" data-i18n-ar="البريد الإلكتروني">Email</label>
          <input type="email" class="form-input" placeholder="you@example.com" required value="jamil@formula-ai.com" />
        </div>
        <div class="form-group">
          <label class="form-label" style="display: flex; justify-content: space-between;">
            <span data-i18n-ar="كلمة المرور">Password</span>
            <a href="#" style="color: var(--primary); font-size: 0.85rem;" data-i18n-ar="نسيت؟">Forgot?</a>
          </label>
          <input type="password" class="form-input" placeholder="••••••••" required value="demopassword" />
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-2); font-size: 0.9rem;">
            <input type="checkbox" style="accent-color: var(--primary); width: 18px; height: 18px;" checked />
            <span data-i18n-ar="تذكرني">Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <span data-i18n-ar="دخول">Sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="auth-divider" data-i18n-ar="أو">or</div>

      <button class="btn btn-ghost btn-block" style="margin-bottom: 10px;">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span data-i18n-ar="المتابعة بحساب Google">Continue with Google</span>
      </button>

      <button class="btn btn-ghost btn-block">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span data-i18n-ar="المتابعة بحساب Apple">Continue with Apple</span>
      </button>

      <div class="auth-foot" data-i18n-ar='ليس لديك حساب؟ <a href="./register.html">سجّل الآن مجاناً</a>'>
        Don't have an account? <a href="./register.html">Sign up free</a>
      </div>
    </div>
  </main>

  <script src="./assets/app.js?v=3"></script>
</body>
</html>
